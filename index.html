        .login-screen {

        button:hover { background: linear-gradient(135deg, #2a5148, #d99a3f); }
        .hidden { display: none !important; }
        .page { padding: 24px 20px 60px; }
        .nav { display: flex; gap: 16px; max-width: 1100px; margin: 0 auto 20px; justify-content: center; }
        .nav a { text-decoration: none; padding: 10px 18px; background: #386b60; color: white; border-radius: 999px; font-weight: 700; }

        .title { font-size: clamp(2.4rem, 7vw, 4rem); margin: 0; }
        .subtitle { max-width: 760px; font-size: 1.08rem; line-height: 1.7; margin: 10px 0 0; }
        .wheel-container { 
          max-width: 1100px; 
          margin: 0 auto; 
          perspective: 1000px;
        }
        .wheel-shell {
          background: rgba(255,255,255,0.52); 
          border-radius: 32px; 
          padding: 26px; 
          box-shadow: 0 22px 48px rgba(34, 48, 52, 0.12);
          transform: rotateX(5deg) rotateY(-2deg);
          transform-style: preserve-3d;
          transition: transform 0.6s ease;
        }
        .wheel-shell:hover {
          transform: rotateX(8deg) rotateY(3deg);
        }
        svg { 
          display: block; 
          width: min(100%, 860px); 
          margin: 0 auto; 
          filter: drop-shadow(0 32px 24px rgba(30, 45, 38, 0.22));
        }
        .season-segment { 
          cursor: pointer; 
          transition: transform 0.18s ease, filter 0.18s ease;
          transform-origin: center; 
        }
        .season-segment:hover { 
          filter: brightness(1.06) drop-shadow(0 8px 8px rgba(0,0,0,0.12)); 
          transform: scale(1.02);
        }

      <script>
        const password = 'Noongar2026';
        const loginScreen = document.getElementById('login-screen');
        const app = document.getElementById('app');
        const input = document.getElementById('password-input');

        function unlock() {
          if (input.value === password) {
            loginScreen.classList.add('hidden');
            app.classList.remove('hidden');
          } else {
            alert('Incorrect password. Please try again.');
            input.value = '';
            input.focus();
          }
        }

        document.getElementById('unlock-button').addEventListener('click', unlock);
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') unlock();
        });

        document.querySelectorAll('.season-segment').forEach(function (segment) {
          segment.addEventListener('click', function () {
            const season = this.getAttribute('data-season');
            window.location.href = 'season_pages/' + season.toLowerCase() + '.html';
          });
        });
      </script>

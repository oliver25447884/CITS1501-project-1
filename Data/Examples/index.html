
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Noongar Seasons – Weather Wheel</title>
      <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: radial-gradient(circle at 80% -10%, #365878 0, transparent 38%), linear-gradient(155deg, #071522 0%, #102d42 48%, #1c4659 100%);
          color: #10212d;
          overflow-x: hidden;
          overflow-y: auto;
        }
        .rainfall-layer {
          position: fixed;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          z-index: 0;
          opacity: 0.26;
        }
        .rain-drop {
          position: absolute;
          top: -12vh;
          width: 1px;
          height: 70px;
          background: linear-gradient(transparent, rgba(188, 226, 239, 0.9));
          transform: rotate(16deg);
          animation: rainfall linear infinite;
        }
        @keyframes rainfall {
          to { transform: translate3d(-10vw, 120vh, 0) rotate(16deg); }
        }
        .login-screen {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(4, 15, 24, 0.72);
          backdrop-filter: blur(14px);
          z-index: 20;
        }
        .login-box {
          width: min(420px, 86vw);
          background: rgba(244, 250, 252, 0.94);
          border: 1px solid rgba(255,255,255,0.7);
          border-radius: 28px;
          padding: 32px 28px;
          box-shadow: 0 24px 70px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; font-size: 1.9rem; letter-spacing: -0.04em; }
        .login-box p { margin-bottom: 18px; line-height: 1.5; }
        input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #b9cbd0; background: rgba(255,255,255,0.8); font-size: 1rem; margin-bottom: 14px; }
        button { width: 100%; padding: 14px 18px; border: 0; border-radius: 14px; background: #0d5e72; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 8px 18px rgba(13, 94, 114, 0.22); }
        button:hover { background: #08758b; }
        .hidden { display: none !important; }
        .page { position: relative; z-index: 1; padding: 28px 20px 70px; }
        .nav { display: flex; gap: 10px; max-width: 1100px; margin: 0 auto 38px; justify-content: flex-start; }
        .nav a { text-decoration: none; padding: 9px 15px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 999px; font-size: 0.9rem; font-weight: 650; backdrop-filter: blur(10px); transition: background 0.2s ease; }
        .nav a:hover { background: rgba(255,255,255,0.24); }
        .topbar { max-width: 1100px; margin: 0 auto 26px; color: white; }
        .eyebrow { margin: 0 0 12px; color: #a7dbe7; font-size: 0.76rem; font-weight: 750; letter-spacing: 0.14em; }
        .title { font-size: clamp(2.6rem, 7vw, 5rem); letter-spacing: -0.07em; line-height: 0.98; margin: 0; }
        .subtitle { max-width: 700px; color: rgba(236, 249, 252, 0.78); font-size: 1.08rem; line-height: 1.7; margin: 18px 0 0; }
        .wheel-container { 
          max-width: 1100px; 
          margin: 0 auto; 
          perspective: 1000px;
        }
        .wheel-shell {
          background: linear-gradient(145deg, rgba(245,252,252,0.86), rgba(215,239,241,0.62));
          border: 1px solid rgba(255,255,255,0.6);
          border-radius: 32px; 
          padding: 26px; 
          box-shadow: 0 26px 70px rgba(0, 8, 16, 0.3), inset 0 1px 0 rgba(255,255,255,0.8);
          transform: rotateX(5deg) rotateY(-2deg);
          transform-style: preserve-3d;
          transition: transform 0.6s ease;
        }
        .wheel-shell:hover {
          transform: rotateX(8deg) rotateY(3deg);
        }
        svg { 
          display: block; 
          width: min(100%, 860px); 
          margin: 0 auto; 
          filter: drop-shadow(0 32px 24px rgba(30, 45, 38, 0.22));
        }
        .season-segment { 
          cursor: pointer; 
          transition: transform 0.18s ease, filter 0.18s ease;
          transform-origin: center; 
        }
        .season-segment:hover { 
          filter: brightness(1.06) drop-shadow(0 8px 8px rgba(0,0,0,0.12)); 
          transform: scale(1.02);
        }
        .climate-section {
          max-width: 1100px;
          margin: 34px auto 0;
          padding: 26px;
          background: rgba(244, 251, 251, 0.93);
          border: 1px solid rgba(255,255,255,0.7);
          border-radius: 24px;
          box-shadow: 0 24px 60px rgba(0, 8, 16, 0.22);
        }
        .climate-heading { margin: 0; font-size: 1.6rem; }
        .climate-note { margin: 8px 0 22px; color: #496064; line-height: 1.5; }
        .chart-wrap { overflow-x: auto; padding-bottom: 4px; }
        .climate-chart {
          min-width: 620px;
          height: 300px;
          display: flex;
          align-items: stretch;
          gap: 14px;
          padding: 18px 12px 0 54px;
          border-left: 1px solid #a9c1bf;
          border-bottom: 1px solid #a9c1bf;
          background: repeating-linear-gradient(to bottom, transparent 0, transparent 59px, rgba(73, 96, 100, 0.14) 60px);
        }
        .chart-season {
          min-width: 74px;
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          align-items: center;
          gap: 8px;
        }
        .bars { height: 235px; display: flex; align-items: flex-end; gap: 5px; }
        .bar {
          width: 22px;
          min-height: 4px;
          border-radius: 6px 6px 0 0;
          position: relative;
          transition: filter 0.18s ease, transform 0.18s ease;
        }
        .bar:hover { filter: brightness(1.08); transform: translateY(-3px); }
        .bar::after {
          content: attr(data-value);
          position: absolute;
          top: -22px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 0.72rem;
          font-weight: 700;
          white-space: nowrap;
        }
        .rain-bar { background: #5a86a5; }
        .temp-bar { background: #e28a52; }
        .season-label { font-weight: 700; font-size: 0.84rem; }
        .chart-legend { display: flex; gap: 20px; margin-top: 18px; font-size: 0.9rem; color: #496064; }
        .legend-item::before { content: ''; display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; }
        .legend-rain::before { background: #5a86a5; }
        .legend-temp::before { background: #e28a52; }
        @media (max-width: 620px) {
          .climate-section { padding: 20px 14px; border-radius: 18px; }
          .chart-legend { gap: 12px; flex-wrap: wrap; }
        }
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
      </style>
    </head>

      <script>
        const password = 'Noongar2026';
        const loginScreen = document.getElementById('login-screen');
        const app = document.getElementById('app');
        const input = document.getElementById('password-input');
        const rainfallLayer = document.getElementById('rainfall-layer');

        for (let index = 0; index < 46; index += 1) {
          const drop = document.createElement('span');
          drop.className = 'rain-drop';
          drop.style.left = `${Math.random() * 110}%`;
          drop.style.animationDuration = `${1.8 + Math.random() * 2.4}s`;
          drop.style.animationDelay = `${Math.random() * -4}s`;
          drop.style.opacity = `${0.2 + Math.random() * 0.55}`;
          rainfallLayer.appendChild(drop);
        }

        function unlock() {
          if (input.value === password) {
            loginScreen.classList.add('hidden');
            app.classList.remove('hidden');
          } else {
            alert('Incorrect password. Please try again.');
            input.value = '';
            input.focus();
          }
        }

        document.getElementById('unlock-button').addEventListener('click', unlock);
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') unlock();
        });

        document.querySelectorAll('.season-segment').forEach(function (segment) {
          segment.addEventListener('click', function () {
            const season = this.getAttribute('data-season');
            window.location.href = 'season_pages/' + season.toLowerCase() + '.html';
          });
        });

        const climateData = [
          { name: 'Birak', rainfall: 23, temperature: 27.4 },
          { name: 'Bunuru', rainfall: 28, temperature: 26.1 },
          { name: 'Djeran', rainfall: 91, temperature: 21.1 },
          { name: 'Makuru', rainfall: 173, temperature: 16.2 },
          { name: 'Djilba', rainfall: 119, temperature: 15.7 },
          { name: 'Kambarang', rainfall: 61, temperature: 19.6 }
        ];
        const chart = document.getElementById('climate-chart');
        const maxRainfall = 180;
        const maxTemperature = 30;

        climateData.forEach(function (season) {
          const seasonColumn = document.createElement('div');
          seasonColumn.className = 'chart-season';
          seasonColumn.innerHTML = `
            <div class="bars">
              <span class="bar rain-bar" style="height: ${(season.rainfall / maxRainfall) * 100}%" data-value="${season.rainfall} mm" title="${season.name}: ${season.rainfall} mm rainfall"></span>
              <span class="bar temp-bar" style="height: ${(season.temperature / maxTemperature) * 100}%" data-value="${season.temperature}°C" title="${season.name}: ${season.temperature}°C average temperature"></span>
            </div>
            <span class="season-label">${season.name}</span>`;
          chart.appendChild(seasonColumn);
        });
      </script>
